name = "lean-svm"
version = "0.1.0"
defaultTargets = ["LeanSVM", "Examples", "lean-svm"]

[[lean_lib]]
name = "LeanSVM"

[[lean_lib]]
name = "Examples"

[[lean_exe]]
name = "lean-svm"
root = "Main"
supportInterpreter = true

# ── LEMMA additions (everything above this line is upstream lean-svm) ─────────────────────
[[lean_lib]]
name = "LemmaTest"
srcDir = "tests"
globs = ["LemmaTest.+"]

[[lean_exe]]
name = "lemma-test"
srcDir = "tests"
root = "LemmaTest.Main"
supportInterpreter = true

[[lean_lib]]
name = "Lemma"

[[lean_exe]]
name = "lemma-audit"
srcDir = "tests"
root = "LemmaAudit.Main"
supportInterpreter = true

[[lean_exe]]
name = "lemma-vectors"
srcDir = "tests"
root = "LemmaVectors.Main"
