<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">LEMMA mark: an L ending in a Q.E.D. tombstone</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2030"/>
      <stop offset="1" stop-color="#0B0E15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#E39B1F"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <!-- the L -->
  <path d="M66 52 H96 V170 H150 V200 H66 Z" fill="#F4F1EA"/>
  <!-- the tombstone ∎ (end of proof) -->
  <rect x="164" y="170" width="30" height="30" rx="3" fill="url(#gold)"/>
</svg>
